# In-memory database only: tests must not alter the developer's MySQL schema.
spring.datasource.url=jdbc:h2:mem:pricetag-tests;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.show-sql=false
# H2 requires schema-wide index names; MySQL only requires table-wide uniqueness.
spring.jpa.mapping-resources=META-INF/orm-h2-test.xml
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.com.example.pricetag=INFO

# Placeholder credentials: these tests do not call external services.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
cloudinary.cloud_name=test
cloudinary.api_key=test
cloudinary.api_secret=test
jwt.secret=pricetag-test-only-signing-key-at-least-32-bytes
stripe.publishable-key=pk_test_placeholder
stripe.secret-key=sk_test_placeholder
stripe.webhook-secret=whsec_test_placeholder
orders.expiration.check-delay-ms=3600000
