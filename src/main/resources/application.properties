#db configuration
spring.sql.init.platform=mysql
spring.sql.init.mode=always
spring.datasource.url=jdbc:mysql://${RAILWAY_TCP_PROXY_DOMAIN}:${RAILWAY_TCP_PROXY_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true
