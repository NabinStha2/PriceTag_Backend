# =========================================================
# SERVER
# =========================================================
server.address=0.0.0.0
server.port=${PORT:8080}
# Local default = dev
# Render should set SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Loads local .env if it exists.
# Render uses Environment Variables instead.
spring.config.import=optional:file:.env[.properties]
# =========================================================
# DATABASE - RAILWAY MYSQL
# =========================================================
#spring.datasource.url=jdbc:mysql://${RAILWAY_TCP_PROXY_DOMAIN}:${RAILWAY_TCP_PROXY_PORT}/${MYSQL_PROD_DATABASE}
#spring.datasource.username=${MYSQLUSER}
#spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_LOCAL_PORT}/${MYSQL_LOCAL_DATABASE}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_LOCAL_USER}
spring.datasource.password=${MYSQL_LOCAL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Better disabled by default in production
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Recommended for REST APIs
spring.jpa.open-in-view=false
# =========================================================
# SQL INITIALIZATION
# =========================================================
# Enable this ONLY if you actually use schema.sql/data.sql.
# spring.sql.init.platform=mysql
# spring.sql.init.mode=always
# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.com.example.pricetag=${APP_LOG_LEVEL:INFO}
# Enable only while debugging SQL
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:INFO}
# =========================================================
# SPRING
# =========================================================
spring.output.ansi.enabled=always
# Keep only if your project currently has circular dependencies.
# Ideally fix those dependencies and remove this.
spring.main.allow-circular-references=true
# =========================================================
# EMAIL
# =========================================================
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# =========================================================
# CLOUDINARY
# =========================================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}