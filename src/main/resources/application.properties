# =========================================================
# SERVER
# =========================================================
server.address=0.0.0.0
server.port=${PORT:8080}
# Use dev when no profile is explicitly selected.
# Render should set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev
# Load local environment variables when .env exists.
spring.config.import=optional:file:.env[.properties]
# =========================================================
# DATABASE — COMMON
# =========================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# =========================================================
# JPA / HIBERNATE — COMMON
# =========================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Preserve the existing API's JSON defaults while using Boot 4's Jackson 3 mapper.
spring.jackson.use-jackson2-defaults=true
# =========================================================
# LOGGING — COMMON
# =========================================================
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.com.example.pricetag=${APP_LOG_LEVEL:INFO}
# =========================================================
# SPRING
# =========================================================
spring.output.ansi.enabled=always
# Remove this after fixing any circular dependencies.
spring.main.allow-circular-references=true
# =========================================================
# EMAIL
# =========================================================
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# =========================================================
# CLOUDINARY
# =========================================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
# =========================================================
# STRIPE
# =========================================================
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
