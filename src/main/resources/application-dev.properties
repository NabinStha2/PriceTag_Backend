# =========================================================
# LOCAL MYSQL
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_LOCAL_PORT:3306}/${MYSQL_LOCAL_DATABASE:pricetag}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_LOCAL_USER:root}
spring.datasource.password=${MYSQL_LOCAL_PASSWORD}
# =========================================================
# DEVELOPMENT JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# =========================================================
# DEVELOPMENT LOGGING
# =========================================================
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:TRACE}