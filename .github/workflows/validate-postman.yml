name: Validate Postman Collection

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate-postman:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pricetag
          MYSQL_USER: pricetag
          MYSQL_PASSWORD: pricetag
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start Spring Boot application
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/pricetag
          SPRING_DATASOURCE_USERNAME: pricetag
          SPRING_DATASOURCE_PASSWORD: pricetag
          EMAIL_HOST: localhost
          EMAIL_PORT: "1025"
          EMAIL_USERNAME: ci@example.com
          EMAIL_PASSWORD: ci-password
          CLOUDINARY_CLOUD_NAME: ci
          CLOUDINARY_API_KEY: ci
          CLOUDINARY_API_SECRET: ci
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-jwt
          STRIPE_PUBLISHABLE_KEY: pk_test_ci
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
        run: |
          ./mvnw spring-boot:run > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/v3/api-docs > /tmp/openapi.json; then
              exit 0
            fi
            sleep 2
          done

          cat app.log
          exit 1

      - name: Validate Postman requests
        run: python3 scripts/validate_postman_collection.py /tmp/openapi.json
