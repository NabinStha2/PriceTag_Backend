$kind: http-request
name: Verify Forgot Password OTP
order: 6000
method: PATCH
url: '{{baseUrl}}/api/v1/auth/verify-forgot-password-otp'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "otpCode": 123456,
      "newPassword": "newpassword123"
    }
