$kind: http-request
name: Register
order: 1000
method: POST
url: '{{baseUrl}}/api/v1/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "password123",
      "fullName": "John Doe",
      "phoneNumber": "+1234567890"
    }
