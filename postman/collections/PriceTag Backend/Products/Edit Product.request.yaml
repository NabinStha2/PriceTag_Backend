$kind: http-request
name: Edit Product
order: 6000
method: PATCH
url: '{{baseUrl}}/api/v1/product/{{productId}}'
pathVariables:
  - key: productId
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated T-Shirt",
      "description": "Updated description",
      "basePrice": 34.99,
      "discountedPrice": 29.99
    }
