$kind: http-request
name: Update Address
order: 3000
method: PATCH
url: '{{baseUrl}}/api/v1/address/{{id}}'
pathVariables:
  - key: id
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "street": "Updated Street",
      "city": "Brooklyn",
      "state": "NY",
      "country": "USA",
      "postalCode": "11201",
      "label": "Office"
    }
