    {
      "unitNumber": "Apt 4B",
      "streetNumber": "123",
      "street": "Main Street",
      "city": "New York",
      "state": "NY",
      "country": "USA",
      "postalCode": "10001",
      "label": "Home",
      "isDefault": true
    }
