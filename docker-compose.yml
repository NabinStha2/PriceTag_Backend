services:
  pricetag:
    image: nabinstha/pricetag-java-springboot:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      # Containers reach MySQL through its Compose service name, not localhost.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_LOCAL_DATABASE:?MYSQL_LOCAL_DATABASE is required}?createDatabaseIfNotExist=true
    depends_on:
      mysqldb:
        condition: service_healthy

  mysqldb:
    # The existing mysql-data directory was initialized with MySQL 9.4.0.
    image: mysql:9.4.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_LOCAL_DATABASE:?MYSQL_LOCAL_DATABASE is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_LOCAL_PASSWORD:?MYSQL_LOCAL_PASSWORD is required}
    healthcheck:
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./mysql-data:/var/lib/mysql
